/* =====================================================================
   SPRITES  (strings of palette letters, cached to offscreen canvases)
   '.' = transparent.  Upper-case letters are replaced per sprite:
   X = main colour, U = its shade, K = skin, H = hair, S = shirt ...
   ===================================================================== */
const SHADE = { a:'a', b:'a', c:'b', d:'c', e:'d', f:'g', g:'h', h:'i', i:'a', j:'i', k:'j', l:'k', m:'n', n:'o', o:'p', p:'a', q:'a', r:'q', s:'r' };
const SPR = {};
const sprCache = {};
function defSpr(name, rows, opts) { SPR[name] = { rows, opts: opts || {} }; }
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function rowsToCanvas(rows, subs, outline, flip) {
  const h = rows.length; let w = 0;
  rows.forEach(r => { if (r.length > w) w = r.length; });
  const pad = outline ? 1 : 0;
  const grid = [];
  for (let y = 0; y < h + pad * 2; y++) grid.push(new Array(w + pad * 2).fill(null));
  for (let y = 0; y < h; y++) {
    const r = rows[y];
    for (let x = 0; x < r.length; x++) {
      let ch = r[x]; if (ch === '.' || ch === ' ') continue;
      if (subs && subs[ch]) ch = subs[ch];
      if (!PAL[ch]) continue;
      grid[y + pad][(flip ? (w - 1 - x) : x) + pad] = ch;
    }
  }
  if (outline) addOutline(grid, typeof outline === 'string' ? outline : 'a');
  return gridToCanvas(grid);
}
function addOutline(grid, col) {
  const h = grid.length, w = grid[0].length, add = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (grid[y][x]) continue;
    if ((y > 0 && grid[y-1][x] && grid[y-1][x] !== '#') || (y < h-1 && grid[y+1][x] && grid[y+1][x] !== '#') ||
        (x > 0 && grid[y][x-1] && grid[y][x-1] !== '#') || (x < w-1 && grid[y][x+1] && grid[y][x+1] !== '#')) add.push([x, y]);
  }
  add.forEach(([x, y]) => grid[y][x] = col);
}
function gridToCanvas(grid) {
  const h = grid.length, w = grid[0].length, c = newCanvas(w, h), g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = grid[y][x]; if (!ch) continue;
    g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1);
  }
  return c;
}
/* get a cached sprite canvas. subs e.g. {X:'c'} ; U defaults to shade of X */
function spr(name, subs, flip) {
  const key = name + (subs ? JSON.stringify(subs) : '') + (flip ? 'F' : '');
  let c = sprCache[key];
  if (!c) {
    const d = SPR[name]; if (!d) return null;
    const s = Object.assign({}, d.opts.subs || {}, subs || {});
    if (s.X && !s.U) s.U = SHADE[s.X];
    c = sprCache[key] = rowsToCanvas(d.rows, s, d.opts.outline, flip);
  }
  return c;
}
function drawSpr(g, name, x, y, subs, flip) { const c = spr(name, subs, flip); if (c) g.drawImage(c, Math.round(x), Math.round(y)); return c; }
function sprW(name) { const c = spr(name); return c ? c.width : 0; }

const CH_W = 26, CH_H = 30, CH_OX = 5, CH_OY = 4; // character canvas size and body offset
const charCache = {};
function composeChar(job) {
  const sp = job.sprite, grid = [];
  for (let y = 0; y < CH_H; y++) grid.push(new Array(CH_W).fill(null));
  const put = (x, y, ch) => {
    const gx = x + CH_OX, gy = y + CH_OY;
    if (gx < 0 || gy < 0 || gx >= CH_W || gy >= CH_H) return;
    grid[gy][gx] = ch;
  };
  const layer = (def, x0) => {
    if (!def) return;
    const y0 = def[0];
    for (let i = 1; i < def.length; i++) {
      const r = def[i];
      for (let x = 0; x < r.length; x++) if (r[x] !== '.') put(x + (x0 || 0), y0 + i - 1, r[x]);
    }
  };
  layer([0].concat(BODY));
  if (sp.acc && sp.acc.indexOf('checks') >= 0) {
    for (let y = 12; y <= 18; y++) for (let x = 0; x < 16; x++) {
      const g = grid[y + CH_OY][x + CH_OX];
      if (g === 'S' && ((x >> 1) + (y >> 1)) % 2 === 0) grid[y + CH_OY][x + CH_OX] = 'U';
    }
  }
  (sp.acc || []).forEach(a => { if (a === 'coat' || a === 'hivis' || a === 'dungarees' || a === 'vest' || a === 'cardigan' || a === 'apron') layer(ACC[a]); });
  (sp.acc || []).forEach(a => { if (!(a === 'coat' || a === 'hivis' || a === 'dungarees' || a === 'vest' || a === 'cardigan' || a === 'apron')) layer(ACC[a]); });
  if (sp.hat !== 'chef' && sp.hat !== 'helmet' && sp.hat !== 'souwester' && sp.hat !== 'hardhat' && sp.hat !== 'pilot' && sp.hat !== 'police') layer(HAIR[sp.style] || HAIR.short);
  else if (sp.style === 'long' || sp.style === 'pony') layer(HAIR[sp.style]);
  if (sp.hat) layer(HATS[sp.hat]);
  if (sp.acc && sp.acc.indexOf('headphones') >= 0) layer(ACC.headphones);
  const pr = PROPS[sp.prop];
  if (pr) { const d = [pr[1]].concat(pr[2]); layer(d, pr[0]); }
  return grid;
}
function charCanvas(jobId, breath, blink, silhouette) {
  const key = jobId + '|' + (breath ? 1 : 0) + (blink ? 1 : 0) + (silhouette ? 1 : 0);
  if (charCache[key]) return charCache[key];
  const job = JOB[jobId], sp = job.sprite;
  let grid = composeChar(job);
  if (breath) { // head sinks 1px: rows above the shoulders move down
    const cut = 11 + CH_OY, g2 = grid.map(r => r.slice());
    for (let y = cut; y >= 1; y--) for (let x = 0; x < CH_W; x++) {
      const up = grid[y - 1][x];
      if (y === cut) { if (up) g2[y][x] = up; } else g2[y][x] = up;
    }
    g2[0] = new Array(CH_W).fill(null);
    grid = g2;
  }
  const map = { K: sp.skin, H: sp.hair, G: SHADE[sp.hair], S: sp.shirt, U: SHADE[sp.shirt], T: sp.pants, V: SHADE[sp.pants],
                X: sp.hatColor || 'c', E: blink ? sp.skin : 'a', M: sp.skin === 'q' ? 'c' : 'c', O: 'p' };
  for (let y = 0; y < CH_H; y++) for (let x = 0; x < CH_W; x++) {
    let ch = grid[y][x]; if (!ch) continue;
    if (map[ch]) ch = map[ch];
    if (!PAL[ch]) ch = null;
    grid[y][x] = silhouette ? (ch ? 'p' : null) : ch;
  }
  addOutline(grid, silhouette ? 'a' : 'a');
  return (charCache[key] = gridToCanvas(grid));
}

/* =====================================================================
   ENGINE: screen scaling, pixel layer + text layer, input, audio, save
   ===================================================================== */
const screenCv = document.getElementById('screen');
const D = screenCv.getContext('2d');
const PB = newCanvas(VW, VH);            // the 320x200 pixel-art buffer
const P = PB.getContext('2d');
P.imageSmoothingEnabled = false;
let S = 3, DPR = 1, CSS_SCALE = 3;       // integer device-pixel scale

function resize() {
  DPR = window.devicePixelRatio || 1;
  const w = window.innerWidth * DPR, h = window.innerHeight * DPR;
  S = Math.max(1, Math.floor(Math.min(w / VW, h / VH)));
  screenCv.width = VW * S; screenCv.height = VH * S;
  screenCv.style.width = (VW * S / DPR) + 'px';
  screenCv.style.height = (VH * S / DPR) + 'px';
  CSS_SCALE = S / DPR;
  D.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();
/* dialogue text: at least 24px on screen when the screen allows it */
function dlgSize() { return Math.max(8, Math.min(12, Math.ceil(24 / CSS_SCALE))); }

/* ---------- text queue (text is drawn crisp at full resolution) ---------- */
let TQ = [];
const FONT_PS = "'Press Start 2P', monospace", FONT_VT = "'VT323', monospace";
function fontStr(f, size) { return size + 'px ' + (f === 'vt' ? FONT_VT : FONT_PS); }
function txt(str, x, y, o) {
  o = o || {};
  TQ.push({ str: String(str), x, y, f: o.f || 'ps', size: o.size || 8, color: o.color || '#f4f4f4',
            align: o.align || 'left', shadow: o.shadow === undefined ? '#1a1c2c' : o.shadow, alpha: o.alpha });
}
function measure(str, f, size) { D.font = fontStr(f, size); return D.measureText(str).width; }
function wrap(str, f, size, maxW) {
  const words = String(str).split(' '), lines = []; let cur = '';

/* ---------- traffic and walkers ---------- */
const CAR_COLORS = ['c', 'j', 'e', 'g', 'b', 'd', 'k', 'm'];
const traffic = [], walkers = [];
function initTraffic() {
  const R = seeded(99);
  HROADS.forEach((ry, i) => {
    for (let k = 0; k < 4; k++) traffic.push({ kind: 'car', dir: 1, y: ry + 4, x: R() * EXT_W, v: 16 + R() * 10, c: CAR_COLORS[Math.floor(R() * 8)] });
    for (let k = 0; k < 3; k++) traffic.push({ kind: 'car', dir: -1, y: ry - 3, x: R() * EXT_W, v: 14 + R() * 10, c: CAR_COLORS[Math.floor(R() * 8)] });
  });
  traffic.push({ kind: 'bus', dir: 1, y: HROADS[0] + 3, x: 100, v: 12 });
  traffic.push({ kind: 'taxi', dir: -1, y: HROADS[1] - 4, x: 400, v: 20 });
  traffic.push({ kind: 'mailvan', dir: 1, y: HROADS[1] + 4, x: 250, v: 15 });
  VROADS.forEach((rx, i) => {
    for (let k = 0; k < 2; k++) traffic.push({ kind: 'carV', dir: i % 2 ? -1 : 1, x: rx + 2, y: R() * EXT_H, v: 14 + R() * 8, c: CAR_COLORS[Math.floor(R() * 8)] });
  });
  const hair = ['a', 'q', 'e', 'd', 'r', 'o'], shirts = ['c', 'j', 'g', 'e', 'b', 'd', 'k', 'm', 'h'], skins = ['s', 'r', 'q'];
  for (let k = 0; k < 16; k++) {
    const horiz = k % 2 === 0;
    const w = { horiz, dir: R() < 0.5 ? -1 : 1, v: 5 + R() * 4, subs: { H: hair[Math.floor(R() * 6)], K: skins[Math.floor(R() * 3)], S: shirts[Math.floor(R() * 9)], T: ['i', 'p', 'q', 'o'][Math.floor(R() * 4)], O: 'a' } };
    if (horiz) { const ry = HROADS[Math.floor(R() * 2)]; w.y = R() < 0.5 ? ry - 2 : ry + RW + 3; w.x = R() * WORLD_W; }
    else { const rx = VROADS[Math.floor(R() * 4)]; w.x = R() < 0.5 ? rx - 4 : rx + RW + 1; w.y = R() * WORLD_H; }
    walkers.push(w);
  }
}
function updateTraffic(dt) {
  traffic.forEach(c => {
    if (c.kind === 'carV') { c.y += c.dir * c.v * dt / 1000; if (c.y > EXT_H + 12) c.y = -12; if (c.y < -12) c.y = EXT_H + 12; }
    else { c.x += c.dir * c.v * dt / 1000; if (c.x > EXT_W + 24) c.x = -24; if (c.x < -24) c.x = EXT_W + 24; }
  });
  walkers.forEach(w => {
    if (w.horiz) { w.x += w.dir * w.v * dt / 1000; if (w.x > WORLD_W) w.dir = -1; if (w.x < 0) w.dir = 1; }
    else { w.y += w.dir * w.v * dt / 1000; if (w.y > WORLD_H) w.dir = -1; if (w.y < 10) w.dir = 1; }
  });
}
function drawTraffic(cx, cy, t) {
  traffic.forEach(c => {
    const x = Math.round(c.x) - cx, y = Math.round(c.y) - cy;
    if (x < -30 || x > VW + 30 || y < -30 || y > VH + 30) return;
    if (c.kind === 'carV') { const s = spr('carV', { X: c.c }); P.save(); if (c.dir < 0) { P.translate(x, y + s.height); P.scale(1, -1); P.drawImage(s, 0, 0); } else P.drawImage(s, x, y - 6); P.restore(); return; }
    const name = c.kind === 'car' ? 'car' : c.kind;
    const s = spr(name, c.kind === 'car' ? { X: c.c } : null, c.dir < 0);
    const bob = (c.kind === 'bus' && Math.floor(t / 300) % 2) ? 1 : 0;
    P.drawImage(s, x - (s.width >> 1), y - s.height + 3 - bob);
  });
}
function drawWalkers(cx, cy, t) {
  walkers.forEach((w, i) => {
    const x = Math.round(w.x) - cx, y = Math.round(w.y) - cy;
    if (x < -10 || x > VW + 10 || y < -14 || y > VH + 14) return;
    const f = Math.floor((t + i * 130) / 220) % 2;
    const s = spr(f ? 'ped1' : 'ped0', w.subs, w.horiz && w.dir < 0);
    P.drawImage(s, x - 3, y - s.height);
  });
}
/* water glints (whole-pixel motion) */
function drawWater(cx, cy, t) {
  const ph = Math.floor(t / 400);
  for (let wy = Math.floor(cy / 6) * 6; wy < cy + VH; wy += 6) {
    for (let wx = Math.floor(cx / 10) * 10; wx < cx + VW; wx += 10) {
      const k = ((wx * 7 + wy * 13) >> 2) % 5;
      const ox = (k * 3 + ph + (wy >> 1)) % 10;
      if (!isWater(wx + ox, wy) || !isWater(wx + ox + 3, wy) || !isWater(wx + ox, wy - 2)) continue;
      if ((k + ph) % 3 === 0) continue;
      rect(wx + ox - cx, wy - cy, 3, 1, k % 2 ? 'k' : 'j');
      if (k === 1) px(wx + ox + 1 - cx, wy - 1 - cy, 'l');
    }
  }
}

function microW(str) { let w = 0; for (const ch of str) w += (MICRO[ch] || MICRO[' '])[0].length + 1; return w - 1; }

/* ---------------- BUILDINGS (part 2) ---------------- */
function line(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
  for (let i = 0; i < 400; i++) { X(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function SP2(name, x, y, s, subs) { const c = spr(name, subs); G.imageSmoothingEnabled = false; G.drawImage(c, Math.round(x), Math.round(y), c.width * s, c.height * s); return c; }
function microBig(str, x, y, c, s) {
  let cx = x;
  for (const ch of str) { const m = MICRO[ch] || MICRO[' ']; for (let r = 0; r < 5; r++) for (let k = 0; k < m[r].length; k++) if (m[r][k] === '#') R(cx + k * s, y + r * s, s, s, c); cx += (m[0].length + 1) * s; }
}
function tri(t, period) { const p = (t % period) / period; return p < 0.5 ? p * 2 : 2 - p * 2; }

  for (const o of others(job)) { if (used.indexOf(o.base) < 0) { wrong.push(o); used.push(o.base); } if (wrong.length === 2) break; }
  qs.push({ kind: 1, text: 'Hi! I work at the ' + pl.name + '. What do you think I do here?',
    choices: shuffle([{ text: 'You ' + phrase(job) + '.', ok: true }].concat(wrong.map(o => ({ text: 'You ' + phrase(o) + '.', hint: "No, I don't " + phrase(o) + '. Look at my uniform!' })))),
    reply: 'Yes! I ' + phrase(job) + ". I'm " + a + ' ' + job.job + '!' });
  // 2. Complete the sentence (3rd person -s)
  qs.push({ kind: 2, text: 'Complete it: The ' + job.job + ' ______ ' + job.rest + '.',
    choices: shuffle([{ text: job.verbS, ok: true }, { text: job.base, hint: spellHint(job) }, { text: job.ing, hint: 'No -ing here! He / she + ' + job.verbS + '.' }]),
    reply: 'The ' + job.job + ' [' + job.verbS + '] ' + job.rest + '.' });
  // 3. Question and short answer
  const truth = Math.random() < 0.5, o = others(job)[0];
  const qv = truth ? phrase(job) : phrase(o);
  const yes = 'Yes, ' + p + ' does.', no = 'No, ' + p + " doesn't.", bad = 'No, ' + p + " don't.";
  const fact = cap(a) + ' ' + job.job + ' ' + job.verbS + ' ' + job.rest + '.';
  qs.push({ kind: 3, text: 'Does ' + a + ' ' + job.job + ' ' + qv + '?',
    choices: shuffle([{ text: yes, ok: truth, hint: 'Think about the job! What does ' + a + ' ' + job.job + ' do?' },
                      { text: no, ok: !truth, hint: 'Think about the job! What does ' + a + ' ' + job.job + ' do?' },
                      { text: bad, hint: "Use doesn't with he / she." }]),
    reply: (truth ? yes : no) + ' ' + fact });
  return qs;
}
function charPositions(room) {
  const ids = room.place.jobs;
  return ids.length === 1 ? [{ id: ids[0], x: 45 }] : [{ id: ids[0], x: 11 }, { id: ids[1], x: 91 }];
}
function startRoom(p) {
  const r = { place: p, hearts: 3, phase: 'choose', job: null, q: 0, qs: null, fb: null, shake: 0, answered: false, wrongs: {}, flash: 0 };
  game.room = r;
  if (p.jobs.length === 1) startJob(r, p.jobs[0]);
  else setDlg(r, p.name.toUpperCase(), 'Two people work at the ' + p.name + '. Tap a person to talk!');
}
function startJob(r, id) {
  r.job = JOB[id]; r.qs = makeQuestions(r.job); r.q = 0; r.hearts = 3; r.phase = 'q'; r.answered = false; r.wrongs = {}; r.fb = null;
  setDlg(r, r.job.tag, r.qs[0].text);
}
function setDlg(r, tag, text, instant) {
  const words = text.split(' ').map(w => { const h = w.indexOf('[') >= 0; return { w: w.replace(/[\[\]]/g, ''), h }; });
  r.dlg = { tag, words, plain: words.map(w => w.w).join(' '), shown: instant ? 9999 : 0, acc: 0 };
}
function dlgDone(r) { return r.dlg.shown >= r.dlg.plain.length; }
function answer(r, ch, idx, bx, by) {
  const q = r.qs[r.q];
  if (ch.ok) {
    sfx.correct(); sfx.coin();
    save.coins += 10; persist();
    addFloater('+10 coins', bx, by);
    r.answered = true; r.fb = { ok: true, text: ['Great job!', 'Correct!', 'Well done!', 'Super!'][rnd(4)], t: game.t };
    setDlg(r, r.job.tag, q.reply, q.kind === 2);
    r.flash = game.t;
    speak(q.reply.replace(/[\[\]]/g, ''));
  } else {
    sfx.wrong();
    r.hearts = Math.max(0, r.hearts - 1);
    r.wrongs[idx] = true; r.shake = game.t;
    r.fb = { ok: false, text: ch.hint, t: game.t };

}
function nextQuestion(r) {
  r.q++; r.answered = false; r.wrongs = {}; r.fb = null;
  if (r.q < 3) { setDlg(r, r.job.tag, r.qs[r.q].text); return; }
  const stars = r.hearts >= 3 ? 3 : (r.hearts === 2 ? 2 : 1);
  const prev = save.jobs[r.job.id];
  save.jobs[r.job.id] = { stars: Math.max(stars, prev ? prev.stars : 0) };
  persist();
  sfx.fanfare();
  game.modal = { kind: 'unlock', job: r.job, stars, t: game.t, isNew: !prev };
  r.phase = 'choose';
  const left = r.place.jobs.filter(id => !save.jobs[id]);
  if (left.length) setDlg(r, r.place.name.toUpperCase(), 'Now tap the other person to talk!', true);
  else setDlg(r, r.job.tag, 'Thank you! Tap < MAP to find more jobs. Or tap me to play again.', true);
  r.job = null;
}
function drawChar(id, x, y, s, t, shakeT, idx) {

}
function drawRoom(t, dt) {

  ROOM[pl.id](t);

  // feedback banner

function drawDialogue(r, t, dt) {
  const d = r.dlg, x = 4, y = 138, w = 312, h = 58;

  R(x + 2, y + 2, w - 4, 1, 'p');

}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(60, now - lastT); lastT = now;
  game.t += dt;
  const t = game.t;
  input.cursor = 'default';
  updateMusic();
  G = P;
  P.clearRect(0, 0, VW, VH);
  const blockInput = !!game.trans;
  if (blockInput && input.click) input.click.used = true;
  switch (game.screen) {
    case 'title': drawTitle(t); break;
    case 'map': drawMap(t, dt); break;
    case 'room': { const stash = game.modal ? input.click : null; if (stash) input.click = null; drawRoom(t, dt); if (stash) input.click = stash; break; }
    case 'book': drawBook(t); break;
    case 'settings': drawSettings(t); break;
  }
  flushLayer();
  if (game.screen === 'room' && game.modal) { G = P; drawUnlockModal(t); flushLayer(); }
  if (game.trans) {
    const tr = game.trans; tr.t += dt;
    const half = tr.dur / 2, k = tr.t < half ? tr.t / half : Math.max(0, 1 - (tr.t - half) / half);
    if (tr.t >= half && !tr.switched) { tr.switched = true; if (tr.fn) tr.fn(); game.screen = tr.to; game.sel = null; game.modal = null; floaters.length = 0; if (tr.to === 'map') game.room = null; }
    G = P;
    const bars = 10, bh = VH / bars;
    for (let b = 0; b < bars; b++) { const w = Math.ceil(VW * Math.min(1, k * 1.4 - (b % 2) * 0.2)); if (w > 0) R(b % 2 ? VW - w : 0, Math.floor(b * bh), w, Math.ceil(bh), 'a'); }
    flushLayer();
    if (tr.t >= tr.dur) game.trans = null;
  }
  screenCv.style.cursor = input.cursor;
  input.click = null;
  input.pressed = {};
  requestAnimationFrame(loop);
}
function boot() {
  buildWorld();
  initTraffic();
  const s = suggestedPlace(); if (s) centerOn(s);
  requestAnimationFrame(t => { lastT = t; loop(t); });
}
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load("8px 'Press Start 2P'"), document.fonts.load("16px 'VT323'")]).catch(() => {}).then(() => {});
}
boot();
