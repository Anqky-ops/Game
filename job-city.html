   ---------------------------------------------------------------------
   Walk around the city, meet the people who work there and help them.
   Every building has its own task that practises one A2 grammar point
   (present simple, present continuous, past simple, some/any, can,
   must, comparatives, prepositions, will, ...).

   TEACHERS: edit the JOBS array below to change names and sentences.

              verbS (verb with -s), rest (rest of the sentence),
              tag (name shown in the dialogue), group (jobs in the same
              group are never used as "wrong" answers for each other),
              sprite (how the character is drawn: skin, hair colour,
              hair style, shirt, trousers, hat, accessories, prop).

   BUILDING TASKS: search for "defTask(" to find the task of each place.
   Most of the words live in small lists you can edit, for example
   CASE_ATTRS / CASE_STORIES (police), AILMENTS (hospital), STORIES
   (library), RECIPES (bakery), EXPERIMENTS (lab), POOL_RULES, TRASH,
   PARK_ACTS, FOODS, DISHES, CITIES ...  Grammar rule cards are in

/* ---------- colour utilities ---------- */
function col(c) { return PAL[c] || c; }
function hex2rgb(h) { h = col(h).replace('#', ''); if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
function rgb2hex(r, g, b) { return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) {
    const d = mx - mn; s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60;
  }
  return [h, s, l];
}
function hsl2hex(h, s, l) {
  h = ((h % 360) + 360) % 360; s = Math.max(0, Math.min(1, s)); l = Math.max(0, Math.min(1, l));
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) [r, g, b] = [c, x, 0]; else if (h < 120) [r, g, b] = [x, c, 0]; else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c]; else if (h < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
  return rgb2hex((r + m) * 255, (g + m) * 255, (b + m) * 255);
}
const rampCache = {};
/* 5 tones: [0] deep shadow, [1] shadow, [2] base, [3] light, [4] highlight */
function ramp(c) {
  c = col(c);
  if (rampCache[c]) return rampCache[c];
  const [h, s, l] = rgb2hsl(...hex2rgb(c));
  const toward = (target, amt) => { const d = ((target - h + 540) % 360) - 180; return h + d * amt; };
  const r = [hsl2hex(toward(245, 0.16), s * 0.9 + 0.06, l * 0.52), hsl2hex(toward(245, 0.08), s * 0.95 + 0.03, l * 0.75), c,
             hsl2hex(toward(55, 0.07), s * 0.95, l + (1 - l) * 0.28), hsl2hex(toward(55, 0.14), s * 0.8, l + (1 - l) * 0.55)];
  return (rampCache[c] = r);
}
function tone(c, k) { return ramp(c)[k]; }
function mix(c1, c2, k) { const a = hex2rgb(c1), b = hex2rgb(c2); return rgb2hex(a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k); }
function rgba(c, a) { const [r, g, b] = hex2rgb(c); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }

/* =====================================================================
   SPRITES  (strings of palette keys, cached to offscreen canvases)
   '.' = transparent.  Upper-case letters are replaced per sprite:
   X = main colour, U = its shade ...
   ===================================================================== */
const SHADE = { a:'a', b:'a', c:'b', d:'c', e:'d', f:'g', g:'h', h:'i', i:'a', j:'i', k:'j', l:'k', m:'n', n:'o', o:'p', p:'a', q:'a', r:'q', s:'r' };
const SPR = {};
const sprCache = {};
function defSpr(name, rows, opts) { SPR[name] = { rows, opts: opts || {} }; }
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }
function rowsToCanvas(rows, subs, outline, flip) {
  const h = rows.length; let w = 0;
  rows.forEach(r => { if (r.length > w) w = r.length; });
  const pad = outline ? 1 : 0;
  const grid = [];
  for (let y = 0; y < h + pad * 2; y++) grid.push(new Array(w + pad * 2).fill(null));
  for (let y = 0; y < h; y++) {
    const r = rows[y];
    for (let x = 0; x < r.length; x++) {
      let ch = r[x]; if (ch === '.' || ch === ' ') continue;
      if (subs && subs[ch]) ch = subs[ch];
      if (!PAL[ch] && ch[0] !== '#') continue;
      grid[y + pad][(flip ? (w - 1 - x) : x) + pad] = ch;
    }
  }
  if (outline) addOutline(grid, typeof outline === 'string' ? outline : 'a');
  return gridToCanvas(grid);
}
function addOutline(grid, c) {
  const h = grid.length, w = grid[0].length, add = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (grid[y][x]) continue;
    if ((y > 0 && grid[y - 1][x]) || (y < h - 1 && grid[y + 1][x]) || (x > 0 && grid[y][x - 1]) || (x < w - 1 && grid[y][x + 1])) add.push([x, y]);
  }
  add.forEach(([x, y]) => grid[y][x] = c);
}
function gridToCanvas(grid) {
  const h = grid.length, w = grid[0].length, c = newCanvas(w, h), g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = grid[y][x]; if (!ch) continue;
    g.fillStyle = col(ch); g.fillRect(x, y, 1, 1);
  }
  return c;
}
function spr(name, subs, flip) {
  const key = name + (subs ? JSON.stringify(subs) : '') + (flip ? 'F' : '');
  let c = sprCache[key];
  if (!c) {
    const d = SPR[name]; if (!d) return null;
    const s = Object.assign({}, d.opts.subs || {}, subs || {});
    if (s.X && !s.U) s.U = SHADE[s.X] || s.X;
    c = sprCache[key] = rowsToCanvas(d.rows, s, d.opts.outline, flip);
  }
  return c;
}

const SAVE_KEY = 'jobcity_save_v2', OLD_SAVE_KEY = 'jobcity_save_v1';

      const s = JSON.parse(raw);

        save = Object.assign(freshSave(), s, { v: 2 });
        save.jobs = s.jobs || {}; save.tasks = s.tasks || {}; save.seen = s.seen || {};
        save.coins = Number(s.coins) || 0;

/* =====================================================================

   A task is a list of rounds. Each round uses one of the engines below:

     place - drag icons onto a map or picture
     route - drive a bus / find a house on a little town map
     talk  - role-play: answer a customer

/* =====================================================================
   POST OFFICE: deliver letters (prepositions of place)
   ===================================================================== */
const LANDMARKS = [['BANK', '#e0d7bf'], ['CAFE', '#c96d4c'], ['SHOP', '#3b63c9'], ['PARK', null], ['SCHOOL', '#e3bd62'], ['CINEMA', '#7a3c8c'], ['LIBRARY', '#c9c1ae']];
/* blocks: 3 columns x 2 rows of blocks; each block has 4 slots (2x2). We use a street layout:
   houses/landmarks on a strip: row A (block row 0, bottom slots) faces row B (block row 1, top slots) across the middle street. */
function genStreet() {
  // 6 positions on each side of the middle street
  const top = [], bot = [];
  const lm = shuffle(LANDMARKS).slice(0, 5);
  const cells = [];
  for (let c = 0; c < 3; c++) for (let s = 0; s < 2; s++) { cells.push({ side: 'top', col: c * 2 + s, c, r: 0, slot: 2 + s }); cells.push({ side: 'bot', col: c * 2 + s, c, r: 1, slot: s }); }
  const sh = shuffle(cells);
  const lots = [];
  const houseC = ['#e27a4c', '#3b63c9', '#38b764', '#c56cf0', '#e8a93b', '#d8394e', '#2a8290'];
  let hn = 1;
  sh.forEach((cell, i) => {
    if (i < lm.length) lots.push(Object.assign({ id: 'L' + i, kind: lm[i][0] === 'PARK' ? 'park' : 'shop', label: lm[i][0], color: lm[i][1] }, cell));
    else lots.push(Object.assign({ id: 'H' + i, kind: 'house', color: houseC[i % houseC.length] }, cell));
  });
  lots.filter(l => l.kind === 'house').sort((a, b) => a.side === b.side ? a.col - b.col : a.side === 'top' ? -1 : 1).forEach(l => { l.num = hn++; });
  // extra lots at the outer rows, just for decoration
  for (let c = 0; c < 3; c++) for (let s = 0; s < 2; s++) { lots.push({ id: 'D' + c + s, kind: 'house', c, r: 0, slot: s, color: '#8e96a8', deco: true }); lots.push({ id: 'E' + c + s, kind: 'house', c, r: 1, slot: 2 + s, color: '#8e96a8', deco: true }); }
  return lots;
}
function streetRel(lots) {
  const main = lots.filter(l => !l.deco);
  const at = (side, col) => main.find(l => l.side === side && l.col === col);
  const opp = l => at(l.side === 'top' ? 'bot' : 'top', l.col);
  const nexts = l => [at(l.side, l.col % 2 ? l.col - 1 : l.col + 1)].filter(Boolean);
  return { main, at, opp, nexts };
}
function postClue(lots) {
  const R2 = streetRel(lots), houses = R2.main.filter(l => l.kind !== 'shop' && l.kind !== 'park');
  const name = l => 'the ' + l.label.toLowerCase();
  for (let tries = 0; tries < 200; tries++) {
    const h = pick(houses), cands = [];
    R2.nexts(h).forEach(n => { if (n.label) cands.push({ text: 'next to ' + name(n), f: l => R2.nexts(l).indexOf(n) >= 0 }); });
    const o = R2.opp(h); if (o && o.label) cands.push({ text: 'opposite ' + name(o), f: l => R2.opp(l) === o });
    for (const cs of [cands.map(c => [c]), cands.flatMap((a, i) => cands.slice(i + 1).map(b => [a, b]))]) {
      for (const combo of shuffle(cs)) {
        const match = houses.filter(l => combo.every(c => c.f(l)));
        if (match.length === 1 && match[0] === h) return { target: h, text: 'The house is ' + combo.map(c => c.text).join(' and ') + '.' };
      }
    }
  }
  return null;
}

/* =====================================================================
   BUS STATION: directions
   ===================================================================== */
const TOWN_PLACES = ['ZOO', 'MUSEUM', 'BEACH', 'STADIUM', 'CASTLE', 'MARKET'];
function genRoute() {
  // random walk over the 4x3 junction grid, at least 3 turns
  for (let tries = 0; tries < 200; tries++) {
    const start = [rnd(4), rnd(3)], path = [start]; let cur = start, heading = pick(['N', 'E', 'S', 'W']);
    const startH = heading;
    const seen = { [start.join()]: 1 };
    for (let s = 0; s < 5; s++) {
      const opts = [['N', 0, -1], ['E', 1, 0], ['S', 0, 1], ['W', -1, 0]].filter(([d, dx, dy]) => { const n = [cur[0] + dx, cur[1] + dy]; return n[0] >= 0 && n[0] < 4 && n[1] >= 0 && n[1] < 3 && !seen[n.join()] && !(d === { N: 'S', S: 'N', E: 'W', W: 'E' }[heading]); });
      if (!opts.length) break;
      const [d, dx, dy] = pick(opts);
      if (s === 0 && d !== heading) { continue; }
      cur = [cur[0] + dx, cur[1] + dy]; path.push(cur); seen[cur.join()] = 1; heading = d;
    }
    const turns = path.slice(1).map((p, i) => ENG.route.dirTo(path[i], p));
    let changes = 0; for (let i = 1; i < turns.length; i++) if (turns[i] !== turns[i - 1]) changes++;
    if (path.length >= 4 && changes >= 2) return { path, startHeading: startH };
  }
  return { path: [[0, 0], [1, 0], [1, 1], [2, 1]], startHeading: 'E' };
}

const outlineCache = {};
function bldOutline(id) {
  if (outlineCache[id]) return outlineCache[id];
  const src = bldCanvas(id); if (!src) return null;
  const m = newCanvas(src.width, src.height), mg = m.getContext('2d');
  mg.drawImage(src, 0, 0); mg.globalCompositeOperation = 'source-in'; mg.fillStyle = '#fff6d3'; mg.fillRect(0, 0, m.width, m.height);
  const o = newCanvas(src.width + 4, src.height + 4), og = o.getContext('2d');
  [[0, 2], [4, 2], [2, 0], [2, 4], [1, 1], [3, 3], [1, 3], [3, 1]].forEach(([dx, dy]) => og.drawImage(m, dx, dy));
  return (outlineCache[id] = o);
}
const labelBoxes = [];
function nameTag(text, cx, y, big, done) {
  const size = big ? 10 : 7, w = Math.ceil(measure(text, 'ps', size)) + (big ? 16 : 10) + (done ? 12 : 0), h = big ? 22 : 15;
  let x = Math.round(cx - w / 2); x = Math.max(4, Math.min(VW - w - 4, x));
  if (!big) {
    if (y < 44 || y > VH - 18) return;
    const hit = yy => labelBoxes.some(b => x < b.x + b.w + 2 && x + w + 2 > b.x && yy < b.y + b.h + 1 && yy + h + 1 > b.y);
    if (hit(y)) { if (!hit(y + 17) && y + 17 <= VH - 18) y += 17; else return; }
    labelBoxes.push({ x, y, w, h });
  }
  y = Math.max(44, Math.min(VH - h - 4, Math.round(y)));
  if (big) { box(x, y, w, h); R(Math.round(cx) - 1, y + h, 3, 3, '#e9e2cc'); }
  else { RR(x, y, w, h, 'rgba(20,23,38,0.82)', 2); }
  if (done) SP('i_starS', x + 5, y + (h - 7) / 2);
  txt(text, x + w / 2 + (done ? 6 : 0), y + (big ? 6 : 4), { size, align: 'center', color: big ? '#ffcd75' : '#f4f4f4', shadow: big ? '#141726' : null });
}
function placeAt(wx, wy) {
  let best = null, area = 1e9;
  PLACES.forEach(p => { if (wx >= p.x && wx < p.x + p.w && wy >= p.y - 10 && wy < p.y + p.h) { const a = p.w * p.h; if (a < area) { area = a; best = p; } } });
  return best;
}
function enterPlace(p) { sfx.enter(); goto('room', () => startRoom(p)); }
function uiZone(x, y) { return y < 40 || (x < 124 && y > 356) || (x > 500 && y > 312); }
function drawMap(t, dt) {
  G = P;
  if (input.down && input.drag && !uiZone(input.sx, input.sy)) { game.cam.x -= input.dx; game.cam.y -= input.dy; }
  input.dx = 0; input.dy = 0;
  const sp = 0.32 * dt;
  if (input.keys.ArrowLeft || input.keys.a || input.keys.A) game.cam.x -= sp;
  if (input.keys.ArrowRight || input.keys.d || input.keys.D) game.cam.x += sp;
  if (input.keys.ArrowUp || input.keys.w || input.keys.W) game.cam.y -= sp;
  if (input.keys.ArrowDown || input.keys.s || input.keys.S) game.cam.y += sp;
  clampCam();
  const cx = Math.round(game.cam.x), cy = Math.round(game.cam.y);
  updateTraffic(dt);
  P.drawImage(worldCv, -cx, -cy);
  drawWater(cx, cy, t);
  let hov = null;
  if (input.mouse && !input.down && input.x >= 0 && !uiZone(input.x, input.y)) hov = placeAt(input.x + cx, input.y + cy);
  if (hov !== game.lastHover) { if (hov) sfx.hover(); game.lastHover = hov; }
  game.hover = hov;
  const hi = hov || game.sel;
  // depth-sorted buildings + decor
  const items = [];
  PLACES.forEach(p => { if (p.x - cx + p.w > -30 && p.x - cx < VW + 30 && p.y - cy + p.h > -10 && p.y - cy - 70 < VH) items.push({ y: p.y + p.h, p }); });
  DECOR.forEach(s => { const x = s.x - cx, y = s.y - cy; if (x > -40 && x < VW + 40 && y > -10 && y < VH + 70) items.push({ y: s.y, s }); });
  items.sort((a, b) => a.y - b.y).forEach(it => {
    if (it.s) { G.drawImage(it.s.cv.c, Math.round(it.s.x - it.s.cv.ox - cx), Math.round(it.s.y - it.s.cv.oy - cy)); return; }
    const p = it.p, sx = p.x - cx, sy = p.y - cy;
    if (p === hi) { const bob = [0, 1, 2, 1][Math.floor(t / 90) % 4]; BLD[p.id](sx, sy - bob, t); const o = bldOutline(p.id); if (o) { G.globalAlpha = 0.9; G.globalCompositeOperation = 'destination-over'; G.drawImage(o, sx - BPX - 2, sy - BPY - 2 - bob); G.globalCompositeOperation = 'source-over'; G.globalAlpha = 1; } }
    else BLD[p.id](sx, sy, t);
    if (placeDone(p)) SP2('i_starS', sx + (p.w >> 1) - 8, sy - 30 + (Math.floor(t / 500) % 2) * 2, 2);
  });
  drawTraffic(cx, cy, t);
  drawWalkers(cx, cy, t);
  // suggestion arrow
  const sug = suggestedPlace();
  if (sug && jobsDone() + tasksDone() < 4) {
    let ax = sug.x - cx + (sug.w >> 1) - 11, ay = sug.y - cy - 60 + [0, 2, 4, 2][Math.floor(t / 150) % 4];
    ax = Math.max(8, Math.min(VW - 30, ax)); ay = Math.max(46, Math.min(VH - 80, ay));
    SP2('i_arrow', ax, ay, 2);
  }
  labelBoxes.length = 0;
  if (save.settings.labels) items.forEach(it => { if (it.p && it.p !== hi) nameTag(it.p.name.toUpperCase(), it.p.x - cx + it.p.w / 2, it.p.y - cy + it.p.h + 2, false, placeDone(it.p)); });
  if (hi) nameTag(save.settings.labels ? hi.name.toUpperCase() : '? ? ?', hi.x - cx + hi.w / 2, hi.y - cy - 64, true, placeDone(hi));
  let clicked = null;
  const c = input.click;
  if (c && !c.used && !uiZone(c.x, c.y)) {
    const p = placeAt(c.x + cx, c.y + cy);
    if (p) { c.used = true; if (!c.touch || game.sel === p) clicked = p; else { game.sel = p; sfx.select(); } }
    else game.sel = null;
  }
  if (keyHit('Enter', ' ')) { const p = game.sel || game.hover || sug; if (p) clicked = p; }
  drawHUD(t);
  drawMinimap(cx, cy);
  if (iconButton(4, 362, 'i_book', 'j')) { sfx.click(); game.bookFrom = 'map'; goto('book'); }
  if (iconButton(44, 362, 'i_gear', 'b')) { sfx.click(); game.settingsFrom = 'map'; goto('settings'); }
  if (iconButton(84, 362, 'i_home', 'o')) { sfx.click(); goto('title'); }
  if (clicked) enterPlace(clicked);
  if (hov) input.cursor = 'pointer';
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(60, now - lastT); lastT = now;
  frame1(dt);
  requestAnimationFrame(loop);
}
function frame1(dt) {
  game.t += dt;
  const t = game.t;
  input.cursor = 'default';
  updateMusic();
  G = P;
  P.clearRect(0, 0, VW, VH);
  if (game.trans && input.click) input.click.used = true;
  const modal = game.modal;
  const stash = modal ? input.click : null; if (stash && game.screen !== 'task') input.click = null;
  const stashP = modal ? input.pressAt : null; if (stashP && game.screen !== 'task') input.pressAt = null;
  switch (game.screen) {
    case 'title': drawTitle(t); break;
    case 'map': drawMap(t, dt); break;
    case 'room': drawRoom(t, dt); break;
    case 'task': drawTaskScreen(t, dt); break;
    case 'book': drawBook(t); break;
    case 'settings': drawSettings(t); break;
  }
  if (stash && game.screen !== 'task') input.click = stash;
  if (stashP && game.screen !== 'task') input.pressAt = stashP;
  flushLayer();
  if (game.modal) {
    G = P;
    if (game.modal.kind === 'unlock') drawUnlockModal(t);
    else if (game.modal.kind === 'taskDone') drawTaskDoneModal(t);
    else if (game.modal.kind === 'rule') drawRuleModal(t);
    flushLayer();
  }
  if (game.trans) {
    const tr = game.trans; tr.t += dt;
    const half = tr.dur / 2, k = tr.t < half ? tr.t / half : Math.max(0, 1 - (tr.t - half) / half);
    if (tr.t >= half && !tr.switched) {
      tr.switched = true; if (tr.fn) tr.fn(); game.screen = tr.to; game.sel = null; if (!(tr.to === 'task' && game.modal)) game.modal = null; floaters.length = 0; confetti.length = 0;
      if (tr.to === 'map') game.room = null;
      if (tr.to === 'room' && game.room) { game.task = null; game.room.phase = 'explore'; game.room.job = null; setDlg(game.room, JOB[game.room.place.jobs[0]].tag, roomGreeting(game.room.place), false); }
    }
    G = P;
    const bars = 10, bh = VH / bars;
    for (let b = 0; b < bars; b++) { const w = Math.ceil(VW * Math.min(1, k * 1.4 - (b % 2) * 0.2)); if (w > 0) R(b % 2 ? VW - w : 0, Math.floor(b * bh), w, Math.ceil(bh), '#141726'); }
    flushLayer();
    if (tr.t >= tr.dur) game.trans = null;
  }
  screenCv.style.cursor = input.cursor;
  input.click = null;
  input.released = null;
  if (!input.down) input.pressAt = null;
  input.pressed = {};
}
function boot() {
  if (save.settings.natural) nvStart();
  buildWorld();
  initTraffic();
  const s = suggestedPlace(); if (s) centerOn(s);
  requestAnimationFrame(t => { lastT = t; loop(t); });
}
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load("8px 'Press Start 2P'"), document.fonts.load("16px 'VT323'")]).catch(() => {}).then(() => { fontsReady = true; for (const k in measureCache) delete measureCache[k]; });
} else fontsReady = true;
setTimeout(() => { fontsReady = true; }, 3000);

/* =====================================================================
   DEBUG / TEST HOOKS  (open the page with ?debug)
   ===================================================================== */
if (/[?&]debug/.test(location.search)) {
  window.JC = {
    game, save, TASKS, PLACES, ROOM, GRAMMAR,
    state() { return { screen: game.screen, place: game.room && game.room.place.id, task: game.task && game.task.def.id, round: game.task && game.task.i, taskState: game.task && game.task.state, hearts: game.task && game.task.hearts, modal: game.modal && game.modal.kind, coins: save.coins }; },
    go(screen) { game.trans = null; game.modal = null; game.screen = screen; },
    enter(id) { game.trans = null; game.modal = null; startRoom(PLACE[id]); game.screen = 'room'; },
    openTask(id, seed) { game.trans = null; game.modal = null; if (!game.room || game.room.place.id !== TASKS[id].place) startRoom(PLACE[TASKS[id].place]); startTask(id, seed); game.screen = 'task'; },
    cam(x, y) { game.cam.x = x; game.cam.y = y; clampCam(); },
    step(n, dt) { for (let i = 0; i < (n || 1); i++) frame1(dt || 16); },
    click(x, y) { input.click = { x, y, used: false, touch: false }; input.mouse = true; frame1(16); },
    solveRound() { return debugSolve(); },
    voice() { return { status: NV.status, progress: NV.progress, device: NV.device, err: NV.err, cached: NV.cache.size, played: NV.played || 0 }; },
    lint() { return debugLint(); },
  };
}
function debugSolve() {
  const T = game.task; if (!T) return 'no task';
  const r = curRound(T);
  if (T.state === 'done') return 'done';
  if (T.state !== 'play') { nextRound(T); return 'next'; }
  switch (r.type) {
    case 'quiz': case 'talk': { const i = r.choices.findIndex(c => c.ok); taskRight(T, r.reply || r.choices[i].text); break; }
    case 'pick': taskRight(T, r.reply); break;
    case 'build': r.placed = r.words.map((w, i) => ({ w, id: i })); r.pool = []; taskRight(T, r.reply); break;
    case 'sort': (r.queue || []).forEach(it => r.done.push(it)); r.queue = []; if (r.belt) r.belt.items = []; r.done = r.items.slice(); taskRight(T, r.reply); break;
    case 'hunt': taskRight(T, r.reply); break;
    case 'place': T.shared.placed.push({ token: r.token, zone: r.zone }); taskRight(T, r.reply); break;
    case 'route': taskRight(T, r.reply || 'ok'); break;
    case 'order': r.slots = r.cards.map((c, i) => ({ c, i })); r.pool = []; taskRight(T, r.reply); break;
    case 'pay': taskRight(T, r.reply); break;
    case 'case': if (r.phase === 'clue') { r.C.solved[r.k] = true; taskRight(T, 'clue'); } else { r.C.arrested = r.C.suspects.findIndex(s => s.thief); taskRight(T, 'solved'); } break;
  }
  return r.type;
}
function debugLint() {
  const errs = [];
  PLACES.forEach(p => {
    if (!BLD[p.id]) errs.push('no building art: ' + p.id);
    if (!ROOM[p.id]) errs.push('no room: ' + p.id);
    const ts = tasksFor(p.id); if (!ts.length) errs.push('no task: ' + p.id);
    ts.forEach(d => { if (!ROOM[p.id].spots.some(s => s.task === d.id)) errs.push('task without hotspot: ' + d.id); if (!GRAMMAR[d.topic]) errs.push('no grammar rule: ' + d.topic); if (!JOB[d.speaker]) errs.push('bad speaker: ' + d.id); });
  });
  // every task generates valid rounds for many seeds
  Object.values(TASKS).forEach(d => {
    for (let s = 1; s <= 60; s++) {
      let rounds;
      try { rounds = withSeed(s * 7919, () => d.rounds()); } catch (e) { errs.push(d.id + ' seed ' + s + ': ' + e.message); break; }
      rounds.forEach((r, i) => {
        if (!ENG[r.type]) errs.push(d.id + ': bad round type ' + r.type);
        if (r.choices) { const ok = r.choices.filter(c => c.ok).length; if (ok !== 1) errs.push(d.id + ' r' + i + ': ' + ok + ' right answers'); const texts = r.choices.map(c => c.text); if (new Set(texts).size !== texts.length) errs.push(d.id + ' r' + i + ': duplicate answers ' + texts.join(' | ')); }
        if (r.cards && r.type === 'pick' && !r.cards.some(c => c.ok)) errs.push(d.id + ' r' + i + ': no right card');
        if (r.type === 'route' && r.mode === 'find' && !r.target) errs.push(d.id + ' r' + i + ': no target');
      });
    }
  });
  // police cases always have exactly one thief who fits all the clues
  for (let s = 1; s <= 500; s++) {
    const C = withSeed(s, () => genCase());
    const fits = C.suspects.filter(su => C.clues.every(cl => C.passes(su.f, cl)));
    if (fits.length !== 1 || !fits[0].thief) { errs.push('case seed ' + s + ': ' + fits.length + ' suspects fit'); break; }
    const visible = C.suspects.filter(su => C.clues.slice(0, 2).every(cl => C.passes(su.f, cl)));
    if (visible.length < 2) { errs.push('case seed ' + s + ': no interview needed'); break; }
  }
  return errs;
}
boot();
